{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | MS Construction</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">

<div class="auth-wrapper">

    <div class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Secure your account</p>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {% if not otp_sent %}
                <!-- STEP 1: EMAIL -->
                <input type="email"
                       name="email"
                       placeholder="Registered Email"
                       required>

                <button type="submit"
                        name="send_otp"
                        class="auth-btn">
                    Send OTP
                </button>

            {% else %}
                <!-- STEP 2: OTP + NEW PASSWORD -->
                <input type="text"
                       name="otp"
                       placeholder="Enter OTP"
                       required>

                <input type="password"
                       name="new_password"
                       placeholder="New Password"
                       required>

                <button type="submit"
                        name="reset_password"
                        class="auth-btn">
                    Reset Password
                </button>
            {% endif %}
        </form>

        <div class="auth-links">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>

</div>

<footer class="auth-footer">
    © 2026 MS Construction. All Rights Reserved.
</footer>

</body>
</html>
